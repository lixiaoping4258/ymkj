syntax = "proto3";

package kratos.api;

option go_package = "github.com/lixiaoping4258/ymkj/internal/conf;conf";

import "google/protobuf/duration.proto";

// Bootstrap 是整个应用的配置根。对应原 ThinkPHP 项目的
// config/*.php + .env，但收敛成一份声明式的 yaml。
message Bootstrap {
  Server server = 1;
  Data data = 2;
  App app = 3;
  Log log = 4;
  Auth auth = 5;
}

// Auth 鉴权配置。对应原项目 config/project.php 的 user_token 段
// 加上各控制器里的 $notNeedLogin 数组。
message Auth {
  // 免登录的操作白名单。原项目是控制器里的 $notNeedLogin = ['index', ...]，
  // 这里展开成完整的 operation 路径（Kratos 的 operation 形如
  // /xtravel.v1.CommonService/GetConfig）。
  //
  // 为空时使用代码里的默认白名单（见 server/middleware.go），
  // 这样即便配置漏了也不会把所有接口锁死。
  repeated string public_operations = 1;

  // 以下三个对应 config/project.php 的 user_token 段
  // 'expire_duration'    => 3600 * 24 * 7   用户 token 过期时长(秒)
  // 'be_expire_duration' => 3600            临近过期自动续期窗口(秒)
  int64 expire_duration = 2;
  int64 be_expire_duration = 3;

  // token 生成用的盐。原项目 env('project.unique_identification')，
  // 也就是 .env [PROJECT] 段的 UNIQUE_IDENTIFICATION。
  string unique_identification = 4;

  // token 缓存键前缀。**必须与 ThinkPHP 隔离** —— 原项目走 BaseCache 的
  // tag 机制，存的是 TP 自己的序列化格式，共用键会互相读出乱码。
  string token_cache_prefix = 5;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    // GORM DSN，形如 user:pass@tcp(host:port)/db?charset=utf8mb4&parseTime=True&loc=Local
    string source = 2;
    // 表前缀。原项目 database.php 里默认是 la_
    string prefix = 3;
    bool debug = 4;
    int32 max_open_conns = 5;
    int32 max_idle_conns = 6;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    string password = 3;
    int32 db = 4;
    google.protobuf.Duration read_timeout = 5;
    google.protobuf.Duration write_timeout = 6;
  }
  Database database = 1;
  Redis redis = 2;
}

message App {
  string name = 1;
  string env = 2;
  // 时区。原项目 .env 里有 DEFAULT_TIMEZONE，交易时段判断强依赖它
  string timezone = 3;
  // 对应 .env 的 APP_DEBUG。
  //
  // ⚠️ 它不只是"调试开关"：原代码里有若干分支依赖它，例如
  // PurchaseController::index 里
  //   if (!env('APP_DEBUG') && in_array($userId, [6,7,1000])) { ... }
  // 以及 PurchaseFaceLists::queryWhere 里同一判断会**去掉 state 过滤**。
  // 所以配错会静默改变业务行为，不是只影响日志。
  bool debug = 4;
}

message Log {
  // debug | info | warn | error
  string level = 1;
  // json | text
  string format = 2;
  string path = 3;
}
