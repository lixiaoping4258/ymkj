syntax = "proto3";

package xtravel.v1;

import "api/xtravel/v1/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/lixiaoping4258/ymkj/api/xtravel/v1;v1";

// OpenAppService 三方平台相关。
// 对应原项目 app/api/route/open.php 的 v1/open 组。
//
//	OpenAppController::$notNeedLogin = []   -> **全部需登录**
service OpenAppService {
  // 三方平台列表（分页）
  //
  // 原实现 OpenAppController::appList -> `$this->dataLists(new AppLists())`
  //
  //	App::where([['state','=',1],['type','=',2]])
  //	    ->field('id,name,logo,type,flag')->order('id','desc')
  //	    ->limit(...)->select()->toArray();
  //	// 逐行：$list['logo'] = !empty($list['logo']) ? get_image_url($list['logo']) : '';
  //
  // ⚠️ logo 的**空值会被换成空串**（不是 null），非空则拼域名。
  rpc GetAppList(GetAppListRequest) returns (RawData) {
    option (google.api.http) = {get: "/v1/open/appList"};
  }

  // 三方平台详情
  //
  // 原实现 OpenAppController::appDetail -> `$this->data((new AppLists())->detail())`
  //
  //	App::where('id', $app_id ?: $this->params['app_id'])
  //	    ->field('id, name, logo, type, fee_rate, flag')
  //	    ->findOrEmpty()->toArray();
  //
  // ⚠️⚠️ **detail 不处理 logo**（lists 会）—— 返回库里的**相对路径**。
  //    原项目的不一致，照搬。
  // ⚠️ 不筛 state/type，能查到已下架或非三方的 app。
  // ⚠️ 查不到时 `findOrEmpty()->toArray()` 返回**空数组 []**，不是 null。
  // 我授权的三方用户列表（分页）
  //
  // 原实现 OpenAppController::authMyUserList -> `$this->dataLists(new AuthMyUserLists())`
  //
  //	三张表：AppAuth JOIN x_app App JOIN x_user User
  //	order: AppAuth.expire asc
  //	7 列：id, app_id, app_nickname, app_avatar, expire, app_name, mobile
  //	mobile 经 substr_replace($m,'****',3,6) 掩码（**结果比原串短 2 位**）
  //
  // 🔴 count() 只有**两个** JOIN（少 x_user）—— 原项目的不一致，刻意照搬。
  rpc GetAuthMyUserList(GetAuthMyUserListRequest) returns (RawData) {
    option (google.api.http) = {get: "/v1/open/authMyUserList"};
  }

  // 获取一级平台授权地址
  //
  // 原实现 OpenAppController::authUrl -> OpenAppLogic::authUrl($appId,$redirect_url)：
  //
  //	$app = App::where('state','=',1)->where('id','=',$appId)->find();
  //	if (!$app) { setError('未获取到一级平台信息'); return false; }
  //	if (!$app->auth_url) { setError('未获取到一级平台信息授权地址'); return false; }
  //	$url = sprintf('%s&appId=%s&state=111&redirectUrl=%s', $app->auth_url, $appId, $redirect_url);
  //
  // ⚠️ **state=111 是硬编码的**；auth_url 原样拼接；**redirectUrl 不做 URL 编码**。
  // ⚠️ 只筛 state=1，**不筛 type**（与 appList 不同）。
  rpc GetAuthUrl(GetAuthUrlRequest) returns (RawData) {
    option (google.api.http) = {get: "/v1/open/authUrl"};
  }

  rpc GetAppDetail(GetAppDetailRequest) returns (RawData) {
    option (google.api.http) = {get: "/v1/open/appDetail"};
  }
}

message GetAppListRequest {}

message GetAppDetailRequest {
  // 对应 `$this->params['app_id']`
  google.protobuf.Int64Value app_id = 1 [json_name = "app_id"];
}

message GetAuthUrlRequest {
  // 对应 `$data['app_id']`；规则 require（文案 '一级平台ID不能为空'）
  google.protobuf.Int64Value app_id = 1 [json_name = "app_id"];
  // 对应 `$data['redirect_url']`；规则 require（文案 '跳转地址不能为空'）
  // ⚠️ 原实现**不做 URL 编码**，直接拼进 auth_url
  string redirect_url = 2 [json_name = "redirect_url"];
}
message GetAuthMyUserListRequest {}