syntax = "proto3";

package xtravel.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/lixiaoping4258/ymkj/api/xtravel/v1;v1";

// IndexService 首页相关。
// 对应原项目 app/api/route/index.php（Route::group('/v1/index', ...)）
//   Route::get('index',      [IndexController::class,  'index']);
//   Route::get('decorate',   [IndexController::class,  'decorate']);
//   Route::get('config',     [IndexController::class,  'config']);     <- 未实现
//   Route::get('bannerList', [BannerController::class, 'getList']);
//   Route::get('test',       [IndexController::class,  'test']);       <- 未实现，见下
//
// ⚠️ IndexController::$notNeedLogin = ['test','index','config','policy','decorate']
//    BannerController::$notNeedLogin = ['getList']
//    -> 本文件的 4 条**全部免登录**。
service IndexService {
  // 首页聚合数据（装修页 + 最新 20 篇文章）
  // 原: IndexLogic::getIndexData()
  //
  //	return ['page' => $decoratePage, 'article' => $article];
  rpc GetIndex(GetIndexRequest) returns (GetIndexReply) {
    option (google.api.http) = {get: "/v1/index/index"};
  }

  // 装修页详情
  // 原: IndexLogic::getDecorate($id)
  //   DecoratePage::field(['type','name','data','meta'])->findOrEmpty($id)->toArray()
  rpc GetDecorate(GetDecorateRequest) returns (GetDecorateReply) {
    option (google.api.http) = {get: "/v1/index/decorate"};
  }

  // 连通性自检（调试接口）
  //
  // 原实现 IndexController::test —— ⚠️ **不走信封**：
  //
  //	public function test(): Json {
  //	    return json(['code' => 200, 'msg' => '成功']);
  //	}
  //
  // 响应体是 `{"code":200,"msg":"成功"}` —— **没有 show，也没有 data**。
  // 硬套本项目信封会变成 {"code":1,"show":0,"msg":"","data":{...}}，与线上契约不符。
  // 所以用 httpx.RawResponder 完全自定义响应体（见 envelope.go 的实现）。
  //
  // 免登录（IndexController::$notNeedLogin 含 'test'）。
  rpc GetTest(GetTestRequest) returns (GetTestReply) {
    option (google.api.http) = {get: "/v1/index/test"};
  }
  // 全局配置（前端启动必读）
  //
  // 原实现 IndexLogic::getConfigData() —— 8 个顶层键，来源分散：
  // 4 段 x_config + 1 张表 + config/project.php 兜底 + 请求域名。
  // 真机数据与逐项说明见 docs/RECON-index-config.md。
  rpc GetIndexConfig(GetIndexConfigRequest) returns (GetIndexConfigReply) {
    option (google.api.http) = {get: "/v1/index/config"};
  }
  // 轮播图列表
  // 原: GetListLogic::getList()（有 10 秒缓存，键 'banner:list'，与 PHP 共用）
  rpc GetBannerList(GetBannerListRequest) returns (GetBannerListReply) {
    option (google.api.http) = {get: "/v1/index/bannerList"};
  }
}

message GetIndexRequest {}

// GetIndexReply 对应 ['page'=>..., 'article'=>[...]]。
message GetIndexReply {
  DecoratePage page = 1 [json_name = "page"];
  repeated HomeArticle article = 2 [json_name = "article"];
}

// DecoratePage 对应 DecoratePage::field(['type','name','data','meta'])->toArray()。
//
// ⚠️ data / meta 是 text 列且模型**没有 json 转换**，所以 PHP 输出的是
//    **原始 JSON 字符串**，不是数组。这里也用 string。
// ⚠️ 主键 id **不在** field 列表里，所以响应里没有 id。
message DecoratePage {
  int32 type = 1 [json_name = "type"];
  string name = 2 [json_name = "name"];
  string data = 3 [json_name = "data"];
  string meta = 4 [json_name = "meta"];
}

// HomeArticle 对应 getIndexData 里文章的对外形态（8 个键）。
//
// ⚠️ click_actual / click_virtual 被 `->hidden([...])` 藏掉了，
//    对外只有计算列 **click**（= click_actual + click_virtual）。
message HomeArticle {
  int64 id = 1 [json_name = "id"];
  string title = 2 [json_name = "title"];
  // ⚠️ 列名就叫 desc（SQL 保留字），PHP 的 toArray() 键名也是 "desc"
  string desc = 3 [json_name = "desc"];
  string abstract = 4 [json_name = "abstract"];
  string image = 5 [json_name = "image"];
  string author = 6 [json_name = "author"];
  // x_article.create_time 是 int(11) -> PHP 输出数字
  int64 create_time = 7 [json_name = "create_time"];
  int64 click = 8 [json_name = "click"];
}

message GetDecorateRequest {
  // 对应 `$this->request->get('id/d')` —— 强制整数
  int32 id = 1 [json_name = "id"];
}

message GetDecorateReply {
  DecoratePage page = 1 [json_name = "page"];
}

message GetBannerListRequest {}

// GetBannerListReply 顶层数组（原实现直接 return $lists）。
message GetBannerListReply {
  repeated BannerItem items = 1;
}

// BannerItem 对应 field(['id','title','image','jump_url','sort','create_time'])。
message BannerItem {
  int64 id = 1 [json_name = "id"];
  string title = 2 [json_name = "title"];
  // 已经过 get_image_url 处理（完整 URL 原样返回）
  string image = 3 [json_name = "image"];
  string jump_url = 4 [json_name = "jump_url"];
  int32 sort = 5 [json_name = "sort"];
  // datetime -> PHP 的 'Y-m-d H:i:s' 字符串
  string create_time = 6 [json_name = "create_time"];
}

message GetIndexConfigRequest {}

// GetIndexConfigReply 对应 getConfigData 的 8 个顶层键。
message GetIndexConfigReply {
  // ⚠️ 对应 `FileService::getFileUrl()` —— **无参数调用**，
  // 等于 format(domain, '') = "<domain>/"（**带尾斜杠**）
  string domain = 1 [json_name = "domain"];
  TabbarStyle style = 2 [json_name = "style"];
  repeated Tabbar tabbar = 3 [json_name = "tabbar"];
  LoginConfig login = 4 [json_name = "login"];
  WebsiteConfig website = 5 [json_name = "website"];
  WebPageConfig webPage = 6 [json_name = "webPage"];
  string version = 7 [json_name = "version"];
  // ⚠️ 本项目 x_config 无 copyright 段 -> 空数组。PHP json_encode([]) = `[]`（不是 `{}`）
  repeated google.protobuf.Struct copyright = 8 [json_name = "copyright"];
}

// TabbarStyle 对应 tabbar.style（ConfigService::get 会 json_decode -> 对象）。
message TabbarStyle {
  string default_color = 1 [json_name = "default_color"];
  string selected_color = 2 [json_name = "selected_color"];
}

// Tabbar 对应 x_decorate_tabbar 一行（在 getTabbarLists 里处理过图片 URL）。
message Tabbar {
  int64 id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
  // 已经过 FileService::getFileUrl
  string selected = 3 [json_name = "selected"];
  string unselected = 4 [json_name = "unselected"];
  // ⚠️ 模型声明了 `protected $json = ['link']` + `$jsonAssoc = true`，
  // 所以 `link` 是**嵌套对象**（{"path":...,"name":...,"type":...}），不是字符串。
  google.protobuf.Struct link = 5 [json_name = "link"];
  int32 is_show = 6 [json_name = "is_show"];
  int64 create_time = 7 [json_name = "create_time"];
  int64 update_time = 8 [json_name = "update_time"];
}

// LoginConfig 对应 $loginConfig。本项目 6 项全部来自 config/project.php。
message LoginConfig {
  // ⚠️ 是**字符串数组** ["1","2"]，不要转成数字
  repeated string login_way = 1 [json_name = "login_way"];
  int32 coerce_mobile = 2 [json_name = "coerce_mobile"];
  int32 login_agreement = 3 [json_name = "login_agreement"];
  int32 third_auth = 4 [json_name = "third_auth"];
  int32 wechat_auth = 5 [json_name = "wechat_auth"];
  int32 qq_auth = 6 [json_name = "qq_auth"];
}

// WebsiteConfig 对应 $website（h5_favicon / shop_logo 经 getFileUrl）。
message WebsiteConfig {
  string h5_favicon = 1 [json_name = "h5_favicon"];
  string shop_name = 2 [json_name = "shop_name"];
  string shop_logo = 3 [json_name = "shop_logo"];
}

// WebPageConfig 对应 $webPage。
message WebPageConfig {
  int32 status = 1 [json_name = "status"];
  int32 page_status = 2 [json_name = "page_status"];
  string page_url = 3 [json_name = "page_url"];
  // ⚠️ request()->domain() . '/mobile' —— **取自当前请求**，不能用配置
  string url = 4 [json_name = "url"];
}
message GetTestRequest {}

// GetTestReply 是空消息 —— 响应体完全由 RawBody() 自定义，
// 不走 protojson 序列化（原实现返回的 {"code":200,"msg":"成功"} 不是信封结构）。
message GetTestReply {}