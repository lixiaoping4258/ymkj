syntax = "proto3";

package xtravel.v1;

import "api/xtravel/v1/common.proto";
import "google/api/annotations.proto";

option go_package = "github.com/lixiaoping4258/ymkj/api/xtravel/v1;v1";

// TicketService 提票 / 茶分相关。
// 对应原项目 app/api/route/ticket.php 的 v1/ticket 组（11 条路由）。
//
//	TicketWalletController 未声明 $notNeedLogin -> **需登录**
service TicketService {
  // 用户钱包余额汇总（茶分 / 茶享值 / 提票积分 …）
  //
  // 原实现 TicketWalletController::amount -> AmountLogic::queryAmount($userId)
  //
  //	$cacheKey = "user:queryAmount:$userId";     // RedisLockService，与 PHP 共用
  //	$time = [env('APP.LIMITTIMESTART'), env('APP.LIMITTIMEEND')];
  //	UserWallet::where(['user_id'=>$userId])->field('amount,type_id,frozen_amount')->select();
  //	逐行按 type_id 补 wait_amount（2/4 走 UserGetTicket 求和并带 limit_time；1/其他为 0）
  //	缺 1/2/3/4 各补一条零值（**只有 2/4 带 limit_time**）
  //	按 type_id 升序；type_id=2 额外补**大写 W** 的 Withdraw_status
  //	返回 ['state'=>1,'msg'=>'查询成功','list'=>...]
  //
  // ⚠️⚠️ data 内部**又套了一层** {state,msg,list} —— 与外层信封是两层。
  // ⚠️ 补零行的 amount 是 int 0，真实行是 "0.00" 字符串 —— 类型不统一，照搬。
  rpc GetTicketAmount(GetTicketAmountRequest) returns (RawData) {
    option (google.api.http) = {get: "/v1/ticket/amount"};
  }
}

message GetTicketAmountRequest {}