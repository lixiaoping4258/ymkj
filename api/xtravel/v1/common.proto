syntax = "proto3";

package xtravel.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/lixiaoping4258/ymkj/api/xtravel/v1;v1";

// CommonService 公共接口。
// 对应原项目 app/api/route/common.php + app/api/controller/v1/common/*。
//
// 路径保持 /v1/common/... 不变，前端无需改动。
//
// ⚠️ 本文件的 json_name 是 camelCase —— 因为原 PHP 源码里这些键就是
// camelCase（'outFee'、'tradeSwitch'、'isOpen'…），不是 DB 列名。
// 对比 user.proto：那边直接透传 DB 行，所以是 snake_case。
// **每个字段都必须对着原 PHP 的实际输出确认，不能套用统一约定。**
service CommonService {
  // 手续费/交易开关等基础配置
  // 原: ConfigController::index  (免登录)
  rpc GetConfig(GetConfigRequest) returns (GetConfigReply) {
    option (google.api.http) = {get: "/v1/common/config"};
  }

  // 交易配置（开关 + 限制时段）
  // 原: IndexController::tradeConfig  (免登录)
  rpc GetTradeConfig(GetTradeConfigRequest) returns (GetTradeConfigReply) {
    option (google.api.http) = {get: "/v1/common/trade/config"};
  }

  // 服务协议
  //
  // 原实现 IndexLogic::getPolicyByType($type)：
  //   title   => ConfigService::get('agreement', $type . '_title', '')
  //   content => ConfigService::get('agreement', $type . '_content', '')
  //
  // 配置缺失时两个键都是**空字符串**（默认 ''），不是 null。
  // 路由在 common.php（group 'v1/common/'），方法却在 IndexController —— 跨文件。
  // IndexController::$notNeedLogin 含 'policy' -> 免登录。
  rpc GetProtocol(GetProtocolRequest) returns (GetProtocolReply) {
    option (google.api.http) = {get: "/v1/common/protocol"};
  }

  // 第三方平台列表
  //
  // 原实现 OpenAppLogic::getThirdAppsList($state = 1)：
  //   App::where(['state' => $state, 'type' => 2])->field('name,flag')->select()->toArray();
  //
  // type = 2 是硬编码；state 默认 1 但控制器没传参，所以恒为 1。
  rpc GetPlatformLists(GetPlatformListsRequest) returns (GetPlatformListsReply) {
    option (google.api.http) = {get: "/v1/common/platform/lists"};
  }
}

message GetConfigRequest {}

message GetConfigReply {
  // 手续费配置(%)  原: ConfigService::get('trade','outFee')
  //
  // 用 google.protobuf.Value 是因为原项目这里的类型是不确定的 ——
  // ConfigService 会把 json 字符串 decode 成数组/标量，proto 定不了具体类型。
  google.protobuf.Value out_fee = 1 [json_name = "outFee"];

  // ⚠️ 命名陷阱：原项目这个 key 叫 tradeSwitch，但它的值其实是
  //    TradeConfigService::checkTradeTime() 的**完整返回对象**，不是布尔开关。
  //    为了前端不改，这里保持原样。
  TradeTimeStatus trade_switch = 2 [json_name = "tradeSwitch"];

  // 求购/兑出限制  原: ConfigService::get('trade','buyOrSaleConfig')
  google.protobuf.Value buy_or_sale_config = 3 [json_name = "buyOrSaleConfig"];
}

// TradeTimeStatus 对应 app/common/service/TradeConfigService::checkTradeTime()
message TradeTimeStatus {
  // 全局总开关。原: ConfigService::get('trade','tradeSwitch',0)
  // 注意原项目注释写「0=开启, 1=关闭」，与直觉相反。
  google.protobuf.Value trade_switch = 1 [json_name = "tradeSwitch"];

  // 当前是否开市 0/1
  int32 is_open = 2 [json_name = "isOpen"];

  // workday | holiday
  string today_type = 3 [json_name = "todayType"];

  // 工作日 | 节假日
  string today_type_str = 4 [json_name = "todayTypeStr"];

  // 当前适用的交易时段
  repeated TradePeriod periods = 5 [json_name = "periods"];

  // 给前端展示的文案
  string tips = 6 [json_name = "tips"];
}

message TradePeriod {
  string start = 1 [json_name = "start"];
  string end = 2 [json_name = "end"];
}

message GetTradeConfigRequest {}

message GetTradeConfigReply {
  // 原: ConfigService::get('trade','switch')
  google.protobuf.Value switch = 1 [json_name = "switch"];

  // 原: ConfigService::get('trade','limitTime')
  google.protobuf.Value limit_time = 2 [json_name = "limitTime"];
}

// RawData 承载**已经组装好的 JSON**，给列表类接口用。
//
// 为什么需要这个出口：
//   - 列表接口的 data 是任意结构的行数组（几十个字段、类型混杂：
//     bigint 主键、decimal 字符串、json 数组、datetime 字符串、"0 转 --" 这种后处理），
//     用 proto 建模既不划算，也会因为 google.protobuf.Struct 把数字转成 float64
//     而**丢掉 bigint 的精度**（id 是 178056289901818 这种量级）。
//   - 但契约又必须精确到键名和类型（见 4.1 节四条规则），
//     所以与其拧着 proto 走，不如让业务层直接产出 JSON。
//
// 用法：handler 返回 &v1.RawData{Json: <预先 marshal 好的 JSON>}，
// 由 api/xtravel/v1/envelope.go 里的 Envelope() 把它摊成信封的 data。
message RawData {
  bytes json = 1;
}

message GetProtocolRequest {
  // 对应 $this->request->get('type/s', '') —— 字符串，默认空串
  string type = 1 [json_name = "type"];
}

// GetProtocolReply 对应 ['title'=>..., 'content'=>...]，两者都可能为空串。
message GetProtocolReply {
  string title = 1 [json_name = "title"];
  string content = 2 [json_name = "content"];
}

message GetPlatformListsRequest {}

// GetPlatformListsReply 对应 field('name,flag')->select()->toArray() —— **顶层数组**。
message GetPlatformListsReply {
  repeated PlatformItem items = 1;
}

message PlatformItem {
  string name = 1 [json_name = "name"];
  string flag = 2 [json_name = "flag"];
}
