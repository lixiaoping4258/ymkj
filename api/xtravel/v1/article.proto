syntax = "proto3";

package xtravel.v1;

import "google/api/annotations.proto";

option go_package = "github.com/lixiaoping4258/ymkj/api/xtravel/v1;v1";

// ArticleService 文章/协议。
// 对应原项目 app/api/controller/v1/article/ArticleController.php
// 路由分组 app/api/route/article.php：Route::group('/v1/article', ...)
//
// ⚠️⚠️ 原文该文件里 **6 条路由是注释掉的**（cate / lists / collect / addCollect /
// cancelCollect / 以及重复的 detail），**只有 3 条是活的**：
//
//	Route::get('about',    [ArticleController::class, 'about']);
//	Route::get('licenses', [ArticleController::class, 'license']);   // ← 方法名是 license，路径是 licenses
//	Route::get('detail',   [ArticleController::class, 'detail']);
//
// 统计路由数时必须**排除注释行**，否则分母虚高（我第一版就把它算成 9 条）。
service ArticleService {
  // 关于我们
  //
  // 原实现 ArticleLogic::about()：
  //
  //	$data = ['title' => '关于我们'];
  //	$result = Article::where(['cid'=>1,'is_show'=>1])
  //	    ->whereRaw('delete_time is null')->order('sort','desc')
  //	    ->field('id,title')->select();
  //	$data['lists'] = $result->toArray();
  //	return $data;
  //
  // ⚠️ 需登录！ArticleController::$notNeedLogin = ['lists','cate','detail'] ——
  //    **about / licenses 都不在里面**。凭"这是关于页面"的直觉会标反。
  rpc GetArticleAbout(GetArticleAboutRequest) returns (ArticleListReply) {
    option (google.api.http) = {get: "/v1/article/about"};
  }

  // 资质证照
  //
  // 原实现 ArticleLogic::license()：与 about 同构，只是 cid=3、title='资质证照'。
  // ⚠️ 同样**需登录**。
  rpc GetArticleLicenses(GetArticleLicensesRequest) returns (ArticleListReply) {
    option (google.api.http) = {get: "/v1/article/licenses"};
  }
}

message GetArticleAboutRequest {}
message GetArticleLicensesRequest {}

// ArticleListReply 对应 `['title' => ..., 'lists' => $result->toArray()]`。
message ArticleListReply {
  string title = 1 [json_name = "title"];
  repeated ArticleItem lists = 2 [json_name = "lists"];
}

// ArticleItem 对应 `->field('id,title')` 的两列。
message ArticleItem {
  // x_article.id 是 int(11)，PHP 的 toArray() 会输出**数字**
  int32 id = 1 [json_name = "id"];
  string title = 2 [json_name = "title"];
}
