syntax = "proto3";

package xtravel.v1;

import "google/api/annotations.proto";

option go_package = "github.com/lixiaoping4258/ymkj/api/xtravel/v1;v1";

// UserService 用户相关。
// 对应原项目 app/api/controller/v1/user/UserController.php。
//
// Stage 2 只迁 info —— 它的价值是「唯一依赖登录态、不依赖其它业务」的端点，
// 用来验证鉴权中间件是否真的工作。
service UserService {
  // 当前登录用户信息
  // 原: UserController::info -> UserLogic::info($this->userId)
  // 需要登录（UserController 的 $notNeedLogin 只放行了 resetPassword）
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoReply) {
    option (google.api.http) = {get: "/v1/user/info"};
  }
}

message GetUserInfoRequest {}

// GetUserInfoReply 对应 UserLogic::info 组装出来的 $profile 数组。
//
// ⚠️ 字段名和类型必须和 PHP 的 json_encode 结果一致，否则前端解析会出问题。
// 几个容易踩的点：
//   - user_money 是 decimal(10,2)，ThinkPHP 输出的是**字符串** "0.00" 而不是数字
//   - has_password / has_opt_pwd / is_real 是 boolean
//   - user_code 查不到时是空字符串 ""
message GetUserInfoReply {
  uint64 id = 1;
  uint64 sn = 2;
  // 0 未知 / 1 男 / 2 女（原样透传）
  int32 sex = 3;
  string nickname = 4;
  string real_name = 5;
  string avatar = 6;
  string mobile = 7;
  uint64 create_time = 8;
  // decimal 用字符串承载，对齐 PHP 的输出
  string user_money = 9;
  // ⚠️ 原项目把 opt_pwd（支付密码哈希）**直接返回给前端**了（只 hidden 了 password）。
  //    这是原系统的信息泄露问题，Go 版为兼容前端暂时保留，见 README 安全章节。
  string opt_pwd = 10;

  bool has_password = 11;
  bool has_opt_pwd = 12;
  bool is_real = 13;

  string user_code = 14;
  UserCodeAuth user_code_auth = 15;
}

message UserCodeAuth {
  // 原: tea_user_code = x_user_accounts 里 app_id=3 的 user_code
  string tea_user_code = 1;
  // 原: tao_user_code = x_user_accounts 里 app_id=4 的 user_code
  string tao_user_code = 2;
}
