syntax = "proto3";

package xtravel.v1;

import "google/api/annotations.proto";
import "api/xtravel/v1/common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/lixiaoping4258/ymkj/api/xtravel/v1;v1";

// UserService 用户相关。
// 对应原项目 app/api/controller/v1/user/UserController.php。
service UserService {
  // 当前登录用户信息
  // 原: UserController::info -> UserLogic::info($this->userId)
  // 需要登录（UserController 的 $notNeedLogin 只放行了 resetPassword）
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoReply) {
    option (google.api.http) = {get: "/v1/user/info"};
  }

  // 最新公告（用户侧）
  //
  // 原实现 v1/user/NoticeController::getNew -> app\api\logic\user\NoticeLogic::getNew()
  //
  //	$cacheKey = 'purchase:getNew';       // 键名带 purchase，但与此无关
  //	$cache = RedisLockService::get($cacheKey);
  //	if ($cache) { return json_decode($cache, true); }
  //	$article = Article::where('cid',2)->field('id,title,content,create_time')
  //	    ->where('is_show',1)->whereNull('delete_time')
  //	    ->order('sort','desc')->order('create_time','desc')->findOrEmpty();
  //	$res = $article->isEmpty() ? [] : $article->toArray();
  //	RedisLockService::set($cacheKey, json_encode($res), 300);
  //	return $res;
  //
  // 控制器：return $this->data(['get_new' => $getNew]);
  //
  // 用 RawData：get_new 的值**要么是对象，要么是空数组 []**，
  // 两种形态用同一个 proto 消息表达不了（EmitUnpopulated 会把空的补成对象）。
  //
  // 免登录（v1/user/NoticeController::$notNeedLogin = ['getNew']）。
  rpc GetUserNoticeNew(GetUserNoticeNewRequest) returns (RawData) {
    option (google.api.http) = {get: "/v1/user/notice/getNew"};
  }

  // 用户默认地址
  //
  // 原实现 v1/user/AddressController::addressDefault -> AddressLogic::addressDefault($params,$userId)
  //
  //	$cacheKey = "purchase:addressDefault:$userId";   // ⚠️ 名字带 purchase，与采购无关
  //	$fields = "id,is_default,address";               // ⚠️ 只返回这三列
  //	带 id -> where(user_id,id)；否则先查 is_default=1，没有则 order(id asc) 取第一条
  //	都找不到 -> setError('未找到地址记录') -> fail
  //
  // ⚠️ 控制器用的是 `$this->success('成功', $result)` —— **不是 data()**，
  //    所以 msg 是 "成功" 而不是空串（见 Envelope 实现）。
  //
  // 需登录（AddressController 未声明 $notNeedLogin）。
  rpc GetAddressDefault(GetAddressDefaultRequest) returns (GetAddressDefaultReply) {
    option (google.api.http) = {get: "/v1/user/address/default"};
  }

  // 地址列表（分页）
  //
  // 原实现 v1/user/AddressController::index -> $this->dataLists(new AddressLists())
  //
  //	UserAddress::hasWhere('app', ['UserAddress.user_id'=>$userId],
  //	    'App.name platform_name,App.flag,UserAddress.id,UserAddress.contact_user,
  //	     UserAddress.contact_phone,UserAddress.address,UserAddress.fettle,UserAddress.is_default')
  //
  // ⚠️ hasWhere 生成的是 **INNER JOIN**（app 关联是 hasOne(App::class,'id','app_id')）：
  //    FROM x_user_address UserAddress
  //    INNER JOIN x_app App ON App.id = UserAddress.app_id
  //    WHERE UserAddress.user_id = ?
  //    app_id 在 x_app 里不存在的地址**不会出现**，count() 用的也是同一个 JOIN。
  //
  // 用 RawData（行的键是 DB 列名 + App 的别名 platform_name）。
  // 需登录。
  rpc GetAddressList(GetAddressListRequest) returns (RawData) {
    option (google.api.http) = {get: "/v1/user/address"};
  }

  // 用户实名信息（已脱敏）
  //
  // 原实现 UserController::getRealInfo -> CardRealLogic::getUserRealInfo($userId)
  //
  //	$real = UserReal::where(['user_id'=>$userId])
  //	    ->field('state,card_no,user_name,birthday,gender,address')->findOrEmpty();
  //	if ($real->isEmpty()) { setError('未找到实名信息'); return false; }
  //	if ($real->state != 'SUCCESS') { setError('用户未实名'); return false; }
  //	$info['card_no']   = StrUtil::hideStr($info['card_no']);
  //	$info['user_name'] = StrUtil::hideName($info['user_name']);
  //
  // ⚠️ 两条错误信息的**顺序**不能反：先"未找到实名信息"，再"用户未实名"。
  // ⚠️ 脱敏是按**字符**(mb_*)算的，中文名要用 rune 处理。
  // 需登录。
  rpc GetRealInfo(GetRealInfoRequest) returns (GetRealInfoReply) {
    option (google.api.http) = {get: "/v1/user/real/info"};
  }

  // 注销前检查（三项）
  //
  // 原实现 UserController::unregisterCheck -> UserLogic::unregisterCheck($userId)
  // 控制器：`return $this->success('请求成功', $result);`
  //
  //	① 未结清订单：MarketPurchase where user_id AND (state='WANTED' OR pay_state='PAYING')
  //	② 平台未解绑：UserAccounts where user_id AND type=2 AND app_id IN (3,4)
  //	③ 积分未清零：UserWallet 逐行判断 amount>0 || frozen_amount>0
  //
  // ⚠️ 三项的顺序决定 errWord 的先后；只要有一项不过 state 就是 0。
  // ⚠️ 用的是 success('请求成功', ...) —— **不是 data()**，所以 msg 是 "请求成功"。
  // 需登录。
  rpc GetUnregisterCheck(GetUnregisterCheckRequest) returns (GetUnregisterCheckReply) {
    option (google.api.http) = {get: "/v1/user/unregisr/check"};
  }

  // 设置所有消息已读
  //
  // 原实现 MessageController::setAllRead -> MessageLogic::setAllRead($userId)
  //
  //	$where = [['recv_id','=',$userId], ['is_read','=',0], ['is_del','=',0]];
  //	if (empty(Messages::where($where)->count())) { return true; }   // ⚠️ 没有未读则**不发 UPDATE**
  //	Messages::where($where)->update(['is_read' => 1]);
  //
  // 控制器：`return $this->data([]);` -> data 是**空数组**
  // 需登录。POST，无请求体。
  rpc SetMessageAllRead(SetMessageAllReadRequest) returns (RawData) {
    option (google.api.http) = {
      post: "/v1/user/message/setAllRead"
      body: "*"
    };
  }

  // 设置单条消息已读
  //
  // 原实现 MessageController::setOneRead -> MessageLogic::setOneRead($userId,$params)
  // 校验：MessageIdValidate -> 'id' => 'require|integer|gt:0'
  //
  //	$where = [['message_id','=',$params['id']], ['recv_id','=',$userId], ['is_del','=',0]];
  //	if (Messages::where($where)->findOrEmpty()->isEmpty()) {
  //	    setError('消息不存在或无权操作'); return false;
  //	}
  //	if ($message['is_read'] == 1) { return true; }      // 已读 -> 短路，不 UPDATE
  //	Messages::where($where)->update(['is_read' => 1]);
  //
  // ⚠️ 传进来的 id 匹配的是 **message_id** 列，不是主键。
  // ⚠️ 带 recv_id -> 越权防护（不能标记别人的消息）。
  // 控制器：`return $this->data([]);` -> data 是空数组。
  rpc SetMessageOneRead(SetMessageOneReadRequest) returns (RawData) {
    option (google.api.http) = {
      post: "/v1/user/message/setOneRead"
      body: "*"
    };
  }

  // 消息详情
  //
  // 原实现 MessageController::detail -> MessageLogic::detail($userId,$params)
  // 校验用 MessageIdValidate 的 ->get()，规则同 setOneRead（require|integer|gt:0）
  //
  //	INNER JOIN messages_body mb ON m.message_id = mb.id
  //	where: m.message_id = id AND m.recv_id = userId AND m.is_del = 0
  //	找不到 -> "消息不存在或无权查看"
  //	自动标已读：if (is_read == 0) Messages::where('id', $messageId)->update([...])
  //	最后加计算列 type_name = TypeEnum::getTypeDesc(type)
  //
  // 🔴 自动标已读那句用的是**主键 id**，而查询按 **message_id** —— 同一个变量两种语义，
  //    是原项目的 bug。按"不改动原项目逻辑"照搬，详见 biz/message_detail.go。
  //
  // 用 RawData：11 个键混来自两张表，且 create_time 未重新格式化。
  rpc GetMessageDetail(GetMessageDetailRequest) returns (RawData) {
    option (google.api.http) = {get: "/v1/user/message/detail"};
  }

  // 删除地址
  //
  // 原实现 AddressController::delete -> AddressLogic::delete($id, $userId)
  //
  //	$address = UserAddress::where(['id'=>$id, 'user_id'=>$userId])->find();
  //	if (!$address) { self::setError('未找到地址记录'); return false; }
  //	$address->delete();        // ⚠️ **硬删除**（表没有 delete_time 列）
  //
  // 控制器：`return $this->success('删除成功');` -> msg 是 "删除成功"，data 是空数组
  // 校验 UserAddressDeleteValidate:
  //	'id.require' => '地址记录ID不能为空'
  //	'id.number'  => '地址记录ID不正确'
  //
  // 🔴🔴 **这是用 GET 做删除**（Route::get('address/delete', ...)）。
  //    迁移时必须按写操作对待：写权限、幂等、以及被预取/爬虫误触发的风险。
  // 需登录。
  rpc DeleteAddress(DeleteAddressRequest) returns (DeleteAddressReply) {
    option (google.api.http) = {get: "/v1/user/address/delete"};
  }
}

message GetUserInfoRequest {}

// GetUserInfoReply 对应 UserLogic::info 组装出来的 $profile 数组。
//
// ⚠️⚠️ json_name 必须逐个显式指定，不能用 protojson 的默认 camelCase。
//
// 原因：原实现的 $profile 直接来自 `$user->toArray()`，键就是**数据库列名**，
// 也就是 snake_case（real_name / create_time / user_money / has_password …）。
// ThinkPHP 的 JsonService 不做任何键名转换就 json_encode 出去，
// 所以线上契约是 snake_case。protojson 默认会把 real_name 输出成 realName，
// 前端就拿不到字段 —— 这是静默的接口破坏，不会报错，只会显示为空。
//
// 教训：**命名规则是逐接口的**。项目里有的接口用 camelCase（见 common.proto
// 的 outFee/tradeSwitch，因为 PHP 源码里就是那样写的），有的用 snake_case
// （凡是直接透传 DB 行的地方）。所以每个字段都要对着原 PHP 的输出写死。
message GetUserInfoReply {
  uint64 id = 1 [json_name = "id"];
  uint64 sn = 2 [json_name = "sn"];
  // 0 未知 / 1 男 / 2 女（原样透传）
  int32 sex = 3 [json_name = "sex"];
  string nickname = 4 [json_name = "nickname"];
  string real_name = 5 [json_name = "real_name"];
  string avatar = 6 [json_name = "avatar"];
  string mobile = 7 [json_name = "mobile"];
  uint64 create_time = 8 [json_name = "create_time"];
  // decimal(10,2)。这一列声明为**可空**，NULL 时 PHP 输出 null；
  // 正常值是字符串 "0.00"（ThinkPHP 对 decimal 输出字符串而不是数字）。
  // 所以用 StringValue：字段不设置 -> null，设置了 -> 字符串。
  // 用普通 string 的话 NULL 会变成 ""，类型和值都不对。
  google.protobuf.StringValue user_money = 9 [json_name = "user_money"];
  // ⚠️ 原项目把 opt_pwd（支付密码哈希）**直接返回给前端**了（只 hidden 了 password）。
  //    这是原系统的信息泄露问题，Go 版为兼容前端暂时保留，见 README 安全章节。
  //    该列可空，实测 1365 个用户里 1277 个是 NULL —— 也就是说绝大多数用户
  //    这里应该是 null 而不是 ""，所以同样必须用 StringValue。
  google.protobuf.StringValue opt_pwd = 10 [json_name = "opt_pwd"];

  bool has_password = 11 [json_name = "has_password"];
  bool has_opt_pwd = 12 [json_name = "has_opt_pwd"];
  bool is_real = 13 [json_name = "is_real"];

  string user_code = 14 [json_name = "user_code"];
  UserCodeAuth user_code_auth = 15 [json_name = "user_code_auth"];
}

message UserCodeAuth {
  // 原: tea_user_code = x_user_accounts 里 app_id=3 的 user_code
  string tea_user_code = 1 [json_name = "tea_user_code"];
  // 原: tao_user_code = x_user_accounts 里 app_id=4 的 user_code
  string tao_user_code = 2 [json_name = "tao_user_code"];
}

message GetUserNoticeNewRequest {}

message GetAddressDefaultRequest {
  // 对应 `$params['id']`；> 0 时走精准查询，否则查默认地址
// ⚠️ 用 Int64Value 而不是 int64 —— 必须区分"没传 id"与"id=0"：
  // 规则按 require -> integer -> gt:0 顺序执行，返回**第一个**失败的文案：
  //   没传 -> "消息ID不能为空"；id=0 -> "消息ID必须大于0"
  // 用普通 int64 时两者都是 0，无法区分。
  int64 id = 1 [json_name = "id"];
}

// GetAddressDefaultReply 对应 field('id,is_default,address') —— 只有这三列。
message GetAddressDefaultReply {
  int64 id = 1 [json_name = "id"];
  int32 is_default = 2 [json_name = "is_default"];
  string address = 3 [json_name = "address"];
}

message GetAddressListRequest {}

message GetRealInfoRequest {}

// GetRealInfoReply 对应 field('state,card_no,user_name,birthday,gender,address') 的 6 列，
// 其中 card_no / user_name 已脱敏。
message GetRealInfoReply {
  // enum('CREATE','SUCCESS','FAIL','PROCESS')；只有 SUCCESS 才会返回，所以恒为 "SUCCESS"
  string state = 1 [json_name = "state"];
  // 已脱敏：首字符 + (字符数-2) 个 * + 末字符；长度 ≤2 原样返回
  string card_no = 2 [json_name = "card_no"];
  // 已脱敏：首字符 + (字符数-1) 个 *
  string user_name = 3 [json_name = "user_name"];
  google.protobuf.StringValue birthday = 4 [json_name = "birthday"];
  google.protobuf.Int32Value gender = 5 [json_name = "gender"];
  google.protobuf.StringValue address = 6 [json_name = "address"];
}

message GetUnregisterCheckRequest {}

// GetUnregisterCheckReply 对应 ['state' => $state, 'errWord' => $errWord]。
message GetUnregisterCheckReply {
  // 1 = 三项都通过（可注销）；0 = 有项不通过
  int32 state = 1 [json_name = "state"];
  // 不通过的原因；全部通过时是**空数组**
  repeated string errWord = 2 [json_name = "errWord"];
}

message SetMessageAllReadRequest {}

message SetMessageOneReadRequest {
  // 对应 `$params['id']`；规则 require|integer|gt:0。⚠️ 匹配的是 x_messages.message_id
// ⚠️ 用 Int64Value 而不是 int64 —— 必须区分"没传 id"与"id=0"：
  // 规则按 require -> integer -> gt:0 顺序执行，返回**第一个**失败的文案：
  //   没传 -> "消息ID不能为空"；id=0 -> "消息ID必须大于0"
  // 用普通 int64 时两者都是 0，无法区分。
  google.protobuf.Int64Value id = 1 [json_name = "id"];
}

message GetMessageDetailRequest {
  // 同 setOneRead：用 Int64Value 区分"没传"与"0"
  google.protobuf.Int64Value id = 1 [json_name = "id"];
}

message DeleteAddressRequest {
  // 对应 `$params['id']`；规则 require|number
  google.protobuf.Int64Value id = 1 [json_name = "id"];
}

// DeleteAddressReply 空消息 —— 响应体完全由 RawBody() 自定义。
//
// 为什么不用 RawData：`success(''删除成功'')` 的 **msg 是 "删除成功"**，
// 而 RawData 的 Envelope 固定 msg=""（它是给普通 data() 接口用的）。
// 这里复用为 index/test 建的 httpx.RawResponder 机制，直接给完整响应体。
message DeleteAddressReply {}