syntax = "proto3";

package xtravel.v1;

import "google/api/annotations.proto";
// RawData 定义在 common.proto（同属 xtravel.v1 包，但 protoc 仍要求显式 import）。
//
// ⚠️ 路径必须与生成脚本传给 protoc 的 target 形式**完全一致**（都是相对项目根的
// api/xtravel/v1/...）。写成 "xtravel/v1/common.proto" 会被 -I./api 解析成同一物理
// 文件的另一个规范名，protoc 会报 "already defined"。
import "api/xtravel/v1/common.proto";

option go_package = "github.com/lixiaoping4258/ymkj/api/xtravel/v1;v1";

// MarketService 市场交易域。
// 对应原项目 app/api/route/market.php（44 条路由）与 app/api/controller/v1/market/*。
//
// ⚠️ 这是项目核心业务域，Stage 3 分批迁。本文件当前只包含第一批：
// 两个不涉及资金、不改数据的只读接口。写入类接口（下单/支付/兑换）
// 必须单独评估，不能顺手一起做。
service MarketService {
  // 支付方式列表
  // 原: PurchaseController::payWay（硬编码，不查库；需要登录）
  rpc GetPayWay(GetPayWayRequest) returns (GetPayWayReply) {
    option (google.api.http) = {get: "/v1/market/pay_way"};
  }

  // 兑换前置校验
  // 原: PurchaseController::checkExchange -> GoodsLogic::checkExchange
  //     （需要登录；会加 2 秒防重复点击锁并查一次兑换单数量）
  rpc CheckExchange(CheckExchangeRequest) returns (CheckExchangeReply) {
    option (google.api.http) = {get: "/v1/market/check/exchange"};
  }

  // 兑换专区首页列表
  // 原: PurchaseController::index -> PurchaseFaceLists
  //     **免登录**（控制器 $notNeedLogin 放行了 index）
  //     挂白名单 no_collection_trade
  //     走交易时段判断；带 20 秒整包缓存
  //
  // 返回 RawData：列表行结构任意（bigint 主键 / decimal 字符串 / json 数组 /
  // "0 转 --" 后处理），用 proto 建模会丢精度又拧巴，见 common.proto 的说明。
  rpc PurchaseIndex(PurchaseIndexRequest) returns (RawData) {
    option (google.api.http) = {get: "/v1/market/purchase"};
  }

  // 秒转专区分类列表
  // 原: SaleController::categories —— **硬编码**，不查库；是 SaleController 里
  //     唯一免登录的方法（$notNeedLogin = ['categories']）
  rpc GetSaleCategories(GetSaleCategoriesRequest) returns (GetSaleCategoriesReply) {
    option (google.api.http) = {get: "/v1/market/sales/categories"};
  }

  // 秒转专区首页列表
  // 原: SaleController::index -> SaleFaceLists
  //     **需要登录**（不在 $notNeedLogin 里）
  //
  // ⚠️ 与 purchase 列表的两个差异（都是实测出来的）：
  //   1. 该接口没有默认排序 —— PurchaseFaceLists 的 switch 有 default 分支，
  //      SaleFaceLists 没有，所以**不带 sort 参数时 SQL 里根本没有 ORDER BY**
  //   2. 行后处理只做 images 的 json 解码，没有 "0 转 --" 那套
  rpc SaleIndex(SaleIndexRequest) returns (RawData) {
    option (google.api.http) = {get: "/v1/market/sales"};
  }

  // 库存汇总（可释放数量 + 是否有释放任务在处理中）
  // 原: PurchaseController::lookAll -> GoodsLogic::lookAll
  //     **需要登录**；结果缓存 10 秒
  //
  // ⚠️ state 字段迁移期恒为 1：它依赖的"释放任务进行中"标记由 PHP 用
  //    ThinkPHP 的 cache() 写入，键空间与 Go 侧隔离。详见 biz/stock.go。
  rpc StockLookAll(StockLookAllRequest) returns (StockLookAllReply) {
    option (google.api.http) = {get: "/v1/market/stock/lookall"};
  }
}

message StockLookAllRequest {}

message StockLookAllReply {
  // 1 正常；0 表示有释放任务正在处理中（迁移期恒为 1，见上面的说明）
  int32 state = 1 [json_name = "state"];
  int64 num = 2 [json_name = "num"];
}

message PurchaseIndexRequest {}

message GetSaleCategoriesRequest {}

message GetSaleCategoriesReply {
  // 原接口 data 是顶层数组：[{"title":"全部","key":"all"}]
  repeated SaleCategory items = 1;
}

message SaleCategory {
  string title = 1 [json_name = "title"];
  // key 是 PHP 数组里的字面键名，输出就是 "key"
  string key = 2 [json_name = "key"];
}

message SaleIndexRequest {}

message GetPayWayRequest {}

message GetPayWayReply {
  // ⚠️ 原接口的 data 是**顶层数组**而不是对象：
  //     {"code":1,"show":0,"msg":"","data":[{"pay_way":1,...}]}
  //     Kratos 的 reply 是 message，默认会被包成 {"data":{"items":[...]}}。
  //     所以这里靠 api/xtravel/v1/envelope.go 里的 Envelope() 把 items 摊出去。
  repeated PayWay items = 1;
}

message PayWay {
  // 原 PHP 是硬编码数组 ['pay_way' => 1, 'pay_name' => '茶交所']，
  // json_encode 出来就是下划线键名。必须显式指定 json_name，
  // 否则 protojson 会输出 payWay / payName，前端取不到字段。
  int32 pay_way = 1 [json_name = "pay_way"];
  string pay_name = 2 [json_name = "pay_name"];
}

message CheckExchangeRequest {}

// 成功时原接口返回的是**空数组** []（`return $this->data([])`），
// 不是空对象 {}。同样由 Envelope() 处理。
message CheckExchangeReply {}
